name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q tools
      - name: Shell syntax check (tracked .sh)
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "bash -n $f"
            bash -n "$f"
          done < <(git ls-files -z '*.sh')
          if [ "$found" -eq 0 ]; then echo "no tracked .sh files"; fi
      - name: Run unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: ds-deploy import smoke
        # 不安装 psycopg2（可选组 deploy）。缺该包时测试必须 skip，不能让 CI 失败。
        run: python -m unittest tools.tests.test_ds_deploy_import_smoke

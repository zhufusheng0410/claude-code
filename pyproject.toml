[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-generator"
version = "0.1.0"
description = "数仓代码自动生成工具"
authors = [
    {name = "DW Generator", email = "dw@example.com"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
]

[project.scripts]
generate-dw = "tools.main:main"

[tool.setuptools]
# 显式列包，避免 flat-layout 自动发现把 demo/docs/scripts 误当顶层包。
packages = ["tools", "tools.core", "tools.generator", "tools.parser", "tools.utils"]

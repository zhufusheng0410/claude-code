[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-generator"
version = "0.1.0"
description = "数仓代码自动生成工具"
authors = [
    {name = "DW Generator", email = "dw@example.com"},
]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # ★ 2026-11-09（评审 B7）：与 constraints.txt 对齐。
    #   原先写 `pandas>=1.3.0`，`pip install .` 会装出与 CI（pandas==2.2.3）
    #   不同的版本；且 pandas 2.2.3 要求 Python>=3.9，与原先的 >=3.8 矛盾。
    "pandas>=2.2.3,<2.3",
    "openpyxl>=3.1.5,<3.2",
]

[project.optional-dependencies]
# MAPPING Excel 冷读加速（缺失时 parser 自动回退 openpyxl）
fast = ["python-calamine>=0.2.0,<0.4"]

[project.scripts]
generate-dw = "tools.main:main"

[tool.setuptools]
# 显式列包，避免 flat-layout 自动发现把 demo/docs/scripts 误当顶层包。
packages = ["tools", "tools.core", "tools.dwd", "tools.generator", "tools.parser", "tools.utils"]
